# Configures version updates. Security updates ignore the schedule, cooldown,
# open-pull-requests-limit and groups below, and arrive as one PR per
# vulnerable dependency.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # Tracks the Node major in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    # Majors outside the vitest group arrive one per PR.
    groups:
      # @vitest/coverage-v8 and @vitest/browser-playwright peer an exact vitest version.
      vitest:
        patterns: ['vitest', '@vitest/*']
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'npm'
    directory: '/iac'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    ignore:
      # Tracks the Node major in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 drops the compiler API that ts-node needs to run the CDK app.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
