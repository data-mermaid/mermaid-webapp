name: PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deps-cache:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/_deps-cache.yml

  cdk-nag:
    if: github.event.pull_request.draft == false
    needs: [deps-cache]
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Fetch yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}

      - name: Install yarn dependencies
        if: ${{ steps.yarn-cache.outputs.cache-hit != 'true' }}
        run: yarn install --immutable

      # cdk synth needs a build/ dir for the S3 asset source;
      # a placeholder is sufficient since cdk-nag only validates constructs.
      - name: Create placeholder build directory
        run: mkdir -p build && echo '<!doctype html>' > build/index.html

      - name: Fetch iac node cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: iac-cache
        with:
          path: iac/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('iac/package-lock.json') }}

      - name: Install IaC dependencies
        if: ${{ steps.iac-cache.outputs.cache-hit != 'true' }}
        working-directory: iac
        run: npm ci

      - name: CDK Nag
        id: cdk-nag
        working-directory: iac
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: us-east-1
        # cdk-nag v3 runs as a CDK policy validation plugin: every unacknowledged finding
        # (error or warning) fails `cdk synth` and is listed in cdk.out/validation-report.json.
        # A missing report means synth failed before validation ran, so that fails too.
        # Only plugins that concluded "failure" count: CDK's built-in CloudFormation Validate
        # plugin can add advisory warnings under a "success" conclusion.
        run: |
          report=cdk.out/validation-report.json
          rm -f "${report}"
          # Capture synth's status straight from PIPESTATUS (`|| true` would reset it under pipefail).
          set +e
          npx cdk synth --quiet 2>&1 | tee /tmp/cdk-nag.log
          synth_exit=${PIPESTATUS[0]}
          set -e
          if [ ! -f "${report}" ]; then
            echo "::error::${report} not found: cdk synth failed before cdk-nag ran"
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          elif [ "${synth_exit}" != "0" ] || [ "$(jq '[.pluginReports[] | select(.conclusion == "failure") | .violations[]] | length' "${report}")" != "0" ]; then
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post CDK Nag results to PR
        if: always() && steps.cdk-nag.conclusion != 'skipped' && github.actor != 'dependabot[bot]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'iac/cdk.out/validation-report.json';
            const list = (violations) => violations
              .map(v => `- \`${v.ruleName}\`\n` + v.violatingConstructs.map(c => `  - \`${c.constructPath}\``).join('\n'))
              .join('\n');
            let body = '## cdk-nag report\n\n';
            if (!fs.existsSync(reportPath)) {
              body += ':x: **`cdk synth` failed before cdk-nag ran.** See the job log.\n';
            } else {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const violations = report.pluginReports
                .filter(p => p.conclusion === 'failure')
                .flatMap(p => p.violations);
              const errors = violations.filter(v => v.severity === 'error');
              const warnings = violations.filter(v => v.severity !== 'error');
              if (violations.length === 0) {
                body += ':white_check_mark: **No unacknowledged findings.**\n';
              }
              if (errors.length > 0) {
                body += `:x: **${errors.length} unacknowledged error(s):**\n\n${list(errors)}\n`;
              }
              if (warnings.length > 0) {
                body += `\n:warning: **${warnings.length} unacknowledged warning(s)** (these also fail the job):\n\n${list(warnings)}\n`;
              }
            }
            body += '\n---\n*See `iac/nag-suppressions.ts` to acknowledge accepted risks.*';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('## cdk-nag report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on CDK Nag errors
        if: steps.cdk-nag.outputs.has_errors == 'true'
        run: |
          echo "::error::cdk-nag found unacknowledged findings — see the PR comment or the CDK Nag step log"
          exit 1

      # Dependabot PRs cannot read repo secrets, so CDK_DEPLOY_ROLE is empty and
      # OIDC role assumption fails. cdk-nag above still runs: it synthesizes
      # against a placeholder account and needs no AWS access.
      - name: Configure AWS credentials
        if: github.actor != 'dependabot[bot]'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.CDK_DEPLOY_ROLE }}
          aws-region: us-east-1
          role-skip-session-tagging: true

      - name: CDK Diff
        id: cdk-diff
        if: github.actor != 'dependabot[bot]'
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: us-east-1
        run: |
          cd iac && ./cdk_diff.sh

      - name: Post CDK Diff results to PR
        if: always() && steps.cdk-diff.outcome != 'skipped' && github.actor != 'dependabot[bot]'
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          CDK_DIFF_OUTCOME: ${{ steps.cdk-diff.outcome }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let log = fs.readFileSync('/tmp/cdk-diff.log', 'utf8');
            if (process.env.CDK_DEFAULT_ACCOUNT) {
              log = log.split(process.env.CDK_DEFAULT_ACCOUNT).join('[ACCOUNT_ID]');
            }
            const status = process.env.CDK_DIFF_OUTCOME === 'success' ? 'Success' : 'Failed';
            const icon = status === 'Success' ? ':white_check_mark:' : ':x:';
            const body = [
              `#### \`cdk diff\` ${icon} ${status}`,
              '<details><summary>Show Output</summary>',
              '',
              '```',
              log,
              '```',
              '',
              '</details>',
              '',
              `*Workflow: \`${process.env.WORKFLOW_NAME}\`*`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('#### `cdk diff`'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
