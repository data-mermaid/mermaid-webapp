name: Push Source Translations to Lokalise

on:
  # Upload the English source whenever it changes on develop (e.g. a merged PR)
  push:
    branches:
      - develop
    paths:
      - 'src/locales/en/**'
  workflow_dispatch: # Allow manual trigger (e.g. backfilling source)

# Prevent overlapping uploads from racing on the change-tracking tag
concurrency:
  group: lokalise-push
  cancel-in-progress: false

permissions:
  contents: write # required to push the change-tracking tag

jobs:
  push-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked] # v7.0.1
        with:
          ref: develop
          fetch-depth: 0 # full history required for change detection / tag tracking

      - name: Push source translations to Lokalise
        id: lokalise-push
        uses: lokalise/lokalise-push-action@b4ac74896aee8083798e2095d96b9cee2a4eaf6e # v5.5.0
        with:
          api_token: ${{ secrets.LOKALISE_API_TOKEN }}
          project_id: ${{ secrets.LOKALISE_PROJECT_ID }}
          # Uploads the base language only. Code owns *new* keys; Lokalise owns
          # the English wording of existing ones, and all target-language values.
          translations_path: src/locales
          file_ext: json
          base_lang: en
          # Track the last-synced commit via a git tag so multi-commit pushes
          # (e.g. squash/merge PRs) reliably detect every changed source file.
          use_tag_tracking: true
          # convert_placeholders: keep i18next {{placeholders}} and custom tags
          # (<helperTextLink>, $t(...)) literal; do not convert to Lokalise
          # universal placeholders.
          #
          # replace_modified: the action defaults this to true, which overwrites
          # the English text of every key that already exists in Lokalise with
          # this repo's value, silently resetting punctuation and wording edits
          # made by translators in the Lokalise UI. Keep it false: this push
          # adds new keys, and nothing else. Reword existing copy in Lokalise,
          # or add a new key. See docs/TranslationSyncWorkflow.md.
          additional_params: |
            convert_placeholders: false
            replace_modified: false
