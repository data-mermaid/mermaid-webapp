name: Infrastructure Workflow

on:
  workflow_call:
    inputs:
      cdk_subcommand:
        required: true
        type: string
      environment:
        description: 'GitHub environment to pull secrets from'
        required: true
        type: string
    secrets:
      VITE_AUTH0_CLIENT_ID:
        required: true
      VITE_MAPBOX_ACCESS_TOKEN:
        required: true
      VITE_CORAL_ATLAS_APP_ID:
        required: true
      VITE_SENTRY_DSN:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      CDK_DEFAULT_ACCOUNT:
        required: true
      CDK_DEPLOY_ROLE:
        required: true

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  cdk:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.environment == 'production' && 'prod' || 'dev' }}
      VITE_ENVIRONMENT: ${{ inputs.environment == 'production' && 'production' || 'dev' }}
      VITE_MERMAID_API: ${{ vars.VITE_MERMAID_API }}
      VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
      VITE_MERMAID_REFERENCE_LINK: ${{ vars.VITE_MERMAID_REFERENCE_LINK }}
      VITE_MERMAID_EXPLORE_LINK: ${{ vars.VITE_MERMAID_EXPLORE_LINK }}
      VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
      VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
      VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
      VITE_CORAL_ATLAS_APP_ID: ${{ secrets.VITE_CORAL_ATLAS_APP_ID }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Fetch yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}

      - name: Install yarn dependencies
        if: ${{ steps.yarn-cache.outputs.cache-hit != 'true' }}
        run: yarn install --immutable

      - name: Create version file for dev
        if: startsWith(github.ref, 'refs/heads/develop')
        run: |
          short_sha=$(git rev-parse --short "${{ github.sha }}")
          echo "export const versionNumber = '$short_sha'" > src/version.js
          echo "VITE_APP_VERSION=$short_sha" >> "$GITHUB_ENV"

      - name: Set variables and version for prod
        if: startsWith(github.ref, 'refs/tags')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "export const versionNumber = '$REF_NAME'" > src/version.js
          echo "VITE_APP_VERSION=$REF_NAME" >> "$GITHUB_ENV"

      - name: Yarn Build
        run: yarn build

      # IaC deps
      - name: Fetch iac node cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: iac-cache
        with:
          path: iac/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('iac/package-lock.json') }}

      - name: Install IaC dependancies
        if: ${{ steps.iac-cache.outputs.cache-hit != 'true' }}
        working-directory: iac
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEPLOY_ROLE: ${{ secrets.CDK_DEPLOY_ROLE }}
        with:
          role-to-assume: ${{ secrets.CDK_DEPLOY_ROLE }}
          aws-region: us-east-1
          role-skip-session-tagging: true

      - name: CDK ${{ inputs.cdk_subcommand }} DEV
        if: startsWith(github.ref, 'refs/heads/develop') || (github.event_name == 'pull_request' && inputs.cdk_subcommand == 'diff')
        working-directory: iac
        env:
          CDK_SUBCOMMAND: ${{ inputs.cdk_subcommand }}
          PYTHONPATH: ${{ github.workspace }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: us-east-1
        run: |
          ./node_modules/.bin/cdk "$CDK_SUBCOMMAND" dev-webapp --require-approval never


      - name: CDK ${{ inputs.cdk_subcommand }} PROD
        if: startsWith(github.ref, 'refs/tags')
        working-directory: iac
        env:
          CDK_SUBCOMMAND: ${{ inputs.cdk_subcommand }}
          PYTHONPATH: ${{ github.workspace }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: us-east-1
        run: |
          ./node_modules/.bin/cdk "$CDK_SUBCOMMAND" prod-webapp -c subdomain=prod --require-approval never
